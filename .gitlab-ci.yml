include:
  - project: ${PIPELINE_REPOSITORY_PREFIX}devenv/gitlab/pipelines
    ref: 4.0.3
    file:
      - merge-request.gitlab-ci.yml
      - scheduled-checks.gitlab-ci.yml

build and verify:
  variables:
    JDK_VERSION: 'jdk21'
  script:
    - echo "No services in project, docker/helm build skipped"
    - touch chart.env
  # печатает версии Docker API демона, с которым работает testcontainers.
  # after_script выполняется и при падении сборки, в отличие от script.
  after_script:
    - |
      echo "=== Docker API diagnostics (NNOP-273) ==="
      echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
      if command -v docker >/dev/null 2>&1; then
        docker version --format 'server={{.Server.Version}} api={{.Server.ApiVersion}} min-api={{.Server.MinAPIVersion}}' \
          || docker version || true
      elif command -v curl >/dev/null 2>&1; then
        curl -s --unix-socket /var/run/docker.sock http://localhost/version || true
      else
        echo "ни docker, ни curl в образе недоступны"
      fi
      echo "--- ~/.testcontainers.properties ---"
      cat ~/.testcontainers.properties 2>/dev/null || echo "файла нет"

deploy mr stand:
  rules:
    - when: never

cleanup:
  rules:
    - when: never

scheduled build:
  # В проекте нет docker-образов поэтому из after_script
  # шаблона убрано вычисление FULL_IMAGE_NAMES по docker-compose конфигу
  after_script:
    - mvn $MAVEN_RUN_OPTIONS org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DprojectType=application -DskipNotDeployed=false -DoutputFormat=json -Dverbose=true $MAVEN_PIPELINE_OPTIONS $MAVEN_EXTRA_BUILD_OPTIONS
  artifacts:
    paths:
      - target/bom.json
    expire_in: 2 days

zap dast:
  rules:
    - when: never

defectdojo:
  variables:
    DEFECTDOJO_SONARQUBE_PROJECT_KEY: 'net.n2oapp.platform:n2o-boot-platform'
  # zap dast отключён, а trivy check containers в проекте без образов тоже может не попасть в пайплайн
  needs:
    - gitleaks scan
    - sca check
    - semgrep sast
    - job: trivy check containers
      optional: true
    - job: zap dast
      optional: true
